<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ksBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1938" />
      <stop offset="50%" stopColor="#082154" />
      <stop offset="100%" stopColor="#020B1E" />
    </linearGradient>
    <linearGradient id="ksBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="50%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="ksPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ksDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="ksRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.5)" />
      <stop offset="100%" stopColor="rgba(16, 185, 129, 0.3)" />
    </linearGradient>
  </defs>

  <!-- Squircle Emblem Base -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="18" fill="url(#ksBase)" stroke="url(#ksRim)" stroke-width="2" />

  <!-- Pillar Anchor (K Stem) -->
  <rect x="15" y="15" width="7" height="34" rx="3.5" fill="url(#ksPillar)" />
  <circle cx="18.5" cy="19" r="1.5" fill="#E0F2FE" />

  <!-- Upper Arch (Ascending Trajectory) -->
  <path d="M23 29.5 C25 29.5 28 27.5 32 23 L44 17" stroke="url(#ksBridge)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lower Arch (Foundation Setu) -->
  <path d="M23 34.5 C26 34.5 29 36.5 33 41 L43 47" stroke="url(#ksBridge)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central High-Speed Clearance Deck -->
  <path d="M13 32 H49" stroke="url(#ksDeck)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Keystone Clearance Node -->
  <circle cx="44" cy="17" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="43" cy="47" r="2.5" fill="#34D399" stroke="#064E3B" stroke-width="1" />

  <!-- Pulse Status Dot -->
  <circle cx="53" cy="53" r="4.5" fill="#10B981" stroke="#020B1E" stroke-width="2" />
</svg>
